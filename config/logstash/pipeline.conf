input {
  beats { port => 5044 }
}

filter {
  if [event_type] {
    date { match => ["occurred_at", "ISO8601"] target => "@timestamp" }
    mutate {
      add_field => { "pipeline_stage" => "logstash" }
      remove_field => ["occurred_at"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ES_USERNAME}"
    password => "${ES_PASSWORD}"
    index => "forge-activity"
    ilm_enabled => false
  }
}
