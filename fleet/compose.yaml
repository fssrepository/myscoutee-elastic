services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 6gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1.5gb
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run scripts/fleet-lab.sh}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - fleet-es-data:/usr/share/elasticsearch/data
    mem_limit: 1g

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?run scripts/fleet-lab.sh}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5602:5601"
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      - elasticsearch
    mem_limit: 1g

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.5.5
    user: root
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_INSECURE_HTTP: "true"
      FLEET_URL: http://fleet-server:8220
      KIBANA_FLEET_SETUP: "1"
      KIBANA_HOST: http://kibana:5601
      KIBANA_FLEET_USERNAME: elastic
      KIBANA_FLEET_PASSWORD: ${ELASTIC_PASSWORD:?run scripts/fleet-lab.sh}
    ports:
      - "127.0.0.1:8220:8220"
    volumes:
      - fleet-agent-data:/usr/share/elastic-agent/state
    depends_on:
      - kibana
    mem_limit: 768m

  fleet-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent-slim:9.5.5
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: "true"
      FLEET_ENROLLMENT_TOKEN: ${FLEET_ENROLLMENT_TOKEN:-}
    volumes:
      - fleet-managed-agent-data:/usr/share/elastic-agent/state
    depends_on:
      - fleet-server
    mem_limit: 512m

volumes:
  fleet-es-data:
  fleet-agent-data:
  fleet-managed-agent-data:
